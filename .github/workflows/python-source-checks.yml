name: Python source checks

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install requests beautifulsoup4
        run: python -m pip install -r requirements_gofile.txt
      - name: Compile Python sources
        run: python -m compileall -q bot.py plugins tests gofile_bot.py gofile_search.py gofile_media.py gofile_uploader.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
