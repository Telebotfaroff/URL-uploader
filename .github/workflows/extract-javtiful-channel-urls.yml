name: Extract Javtiful Channel URLs

on:
  workflow_dispatch:
    inputs:
      start_page:
        description: "Directory page to start from"
        required: true
        default: "1"
        type: string
      max_pages:
        description: "Maximum pages to scan"
        required: true
        default: "500"
        type: string
      delay:
        description: "Delay between requests in seconds"
        required: true
        default: "1"
        type: string

permissions:
  contents: write

concurrency:
  group: extract-javtiful-channel-urls
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: python -m pip install --upgrade pip requests beautifulsoup4 lxml

      - name: Extract channel directory
        env:
          START_PAGE: ${{ inputs.start_page }}
          MAX_PAGES: ${{ inputs.max_pages }}
          REQUEST_DELAY: ${{ inputs.delay }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import time
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urljoin, urlparse, parse_qs, urlencode, urlunparse

          import requests
          from bs4 import BeautifulSoup

          BASE = "https://javtiful.com"
          START_PAGE = max(1, int(os.getenv("START_PAGE", "1")))
          MAX_PAGES = max(1, min(2000, int(os.getenv("MAX_PAGES", "500"))))
          DELAY = max(0.0, min(30.0, float(os.getenv("REQUEST_DELAY", "1"))))
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Accept-Language": "en-US,en;q=0.9",
          }

          session = requests.Session()
          session.headers.update(HEADERS)
          output_json = Path("data/channels.json")
          output_txt = Path("data/channel_urls.txt")
          channels = {}

          # Keep previous results so a later run can extend the saved collection.
          if output_json.exists():
              try:
                  old = json.loads(output_json.read_text(encoding="utf-8"))
                  for item in old.get("channels", []):
                      if item.get("url"):
                          channels[item["url"].rstrip("/").lower()] = item
              except (OSError, json.JSONDecodeError, AttributeError):
                  print("Existing JSON could not be read; starting a fresh collection.")

          def page_url(page):
              if page <= 1:
                  return f"{BASE}/channels"
              return f"{BASE}/channels?" + urlencode({"page": page})

          pages_scanned = 0
          for page in range(START_PAGE, min(START_PAGE + MAX_PAGES, 2001)):
              url = page_url(page)
              print(f"Scanning page {page}: {url}", flush=True)
              response = session.get(url, timeout=30)
              response.raise_for_status()
              soup = BeautifulSoup(response.text, "lxml")

              found = 0
              seen_on_page = set()
              for link in soup.select('a[href*="/channel/"]'):
                  href = link.get("href", "").strip()
                  absolute = urljoin(response.url, href)
                  parsed = urlparse(absolute)
                  if parsed.netloc.lower() not in {"javtiful.com", "www.javtiful.com"}:
                      continue
                  match = re.fullmatch(r"/channel/([^/]+)/?", parsed.path, re.I)
                  if not match:
                      continue
                  slug = match.group(1).strip()
                  if not slug or slug.lower() == "channels" or slug.lower() in seen_on_page:
                      continue
                  seen_on_page.add(slug.lower())

                  text = re.sub(r"\s+", " ", link.get_text(" ", strip=True)).strip()
                  count_match = re.search(r"(\d+)\s+Videos?", text, re.I)
                  video_count = int(count_match.group(1)) if count_match else None
                  name = re.sub(r"\d+\s+Videos?", "", text, flags=re.I).strip() or slug
                  img = link.find("img")
                  thumbnail = None
                  if img:
                      thumbnail = img.get("data-front-lazy-src") or img.get("data-src") or img.get("src")
                      if thumbnail:
                          thumbnail = urljoin(response.url, thumbnail)

                  canonical = f"{BASE}/channel/{slug}"
                  key = canonical.lower()
                  if key not in channels:
                      found += 1
                  channels[key] = {
                      "name": name,
                      "slug": slug,
                      "url": canonical,
                      "video_count": video_count,
                      "thumbnail": thumbnail,
                  }

              pages_scanned += 1
              print(f"Page {page}: {found} new channels; {len(channels)} unique saved so far.", flush=True)

              # Stop when the directory page has no channel entries.
              if not seen_on_page:
                  print("No channel links found on this page; stopping pagination.")
                  break

              # Stop when the page has no explicit next-page link and no higher page number.
              page_numbers = []
              has_next = False
              for anchor in soup.select('a[href*="page="], .pagination a, nav.front-pagination a'):
                  label = anchor.get_text(" ", strip=True).lower()
                  href = anchor.get("href", "")
                  m = re.search(r"[?&]page=(\d+)", href)
                  if m:
                      page_numbers.append(int(m.group(1)))
                  if "next" in label or label in {"›", "»", "→"}:
                      has_next = True
              if not has_next and (not page_numbers or max(page_numbers) <= page):
                  print("No next page detected; directory scan complete.")
                  break
              time.sleep(DELAY)

          sorted_channels = sorted(
              channels.values(),
              key=lambda item: (item.get("name", "").casefold(), item.get("url", "")),
          )
          if not sorted_channels:
              raise SystemExit("No channel URLs were extracted; refusing to write empty output.")

          output_json.parent.mkdir(parents=True, exist_ok=True)
          payload = {
              "source": f"{BASE}/channels",
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "pages_scanned_this_run": pages_scanned,
              "total_channels": len(sorted_channels),
              "channels": sorted_channels,
          }
          output_json.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          output_txt.write_text("\n".join(item["url"] for item in sorted_channels) + "\n", encoding="utf-8")
          print(f"Saved {len(sorted_channels)} unique channels to {output_json} and {output_txt}.")
          PY

      - name: Commit saved channel URLs
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/channels.json data/channel_urls.txt
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update extracted Javtiful channel URLs"
          git push
